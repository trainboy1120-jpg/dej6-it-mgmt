name: qr-app sync (30min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write   # 60日無活動によるcron自動停止を防ぐハートビートcommit用

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync
        run: python3 scripts/sync.py

      # qr-app本体のSupabase(uaxyskjcvfpzuobfcynx)はsync.pyでは一切触らないため、
      # ここで専用keep-aliveを行う(HTTP 401でも「到達=活動」扱いで停止を防げる)。
      # code=000は DNS不達=一時停止の疑い → わざと失敗させてメール通知で気付く。
      # if: always() でsync.pyが失敗してもkeep-aliveだけは必ず走らせる。
      - name: Keep-alive qr-app Supabase (uaxyskjcvfpzuobfcynx)
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://uaxyskjcvfpzuobfcynx.supabase.co/rest/v1/)
          echo "qr-app supabase http=$code"
          if [ "$code" = "000" ]; then
            echo "::error::qr-app Supabaseに到達できません(一時停止の疑い)。supabase.com/dashboard/project/uaxyskjcvfpzuobfcynx でRESUMEしてください"
            exit 1
          fi

      # GitHubは60日commitがないリポジトリのscheduleを自動無効化する。
      # 最終commitから25日以上経っていたらハートビートcommitを積んで延命する。
      - name: Heartbeat commit (keep schedules alive)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "last commit ${age_days} days ago"
          if [ "$age_days" -ge 25 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git add .heartbeat
            git commit -m "chore: heartbeat (keep scheduled workflows alive)"
            git push
          fi
