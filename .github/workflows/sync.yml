name: qr-app sync (manual only; v2.2 で定期実行を停止)

# v2.2 (2026-09): Firebase(qr-app) の参照を止めたため cron は削除。履歴・手動実行(workflow_dispatch)のみ残す。
# 再び自動同期が必要になった場合だけ schedule を戻すこと(その前に README の v2.2 節を読む)。
on:
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync
        run: python3 scripts/sync.py
