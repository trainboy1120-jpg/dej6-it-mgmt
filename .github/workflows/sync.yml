name: qr-app sync (30min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write   # 60日無活動によるcron自動停止を防ぐハートビートcommit用

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync
        run: python3 scripts/sync.py

      # GitHubは60日commitがないリポジトリのscheduleを自動無効化する。
      # 最終commitから25日以上経っていたらハートビートcommitを積んで延命する。
      - name: Heartbeat commit (keep schedules alive)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "last commit ${age_days} days ago"
          if [ "$age_days" -ge 25 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git add .heartbeat
            git commit -m "chore: heartbeat (keep scheduled workflows alive)"
            git push
          fi
